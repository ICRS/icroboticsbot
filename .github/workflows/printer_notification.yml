on:
  push:
    branches:
    - master
    paths:
      - 'printer_notification/**'
      - '.github/workflows/printer_notification.yml'

jobs:
  checkout:
    runs-on: self-hosted
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

  update_deployments:
    runs-on: self-hosted
    needs: checkout
    steps:
      - name: Deploy to remote server
        run: |
          cd printer_notification
          ./docker_build.sh ${GITHUB_SHA}
          ./deploy.sh ${GITHUB_SHA}

