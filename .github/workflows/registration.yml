on:
  push:
    branches:
    - main
    paths:
      - 'registration/**'

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Deploy to remote server
        run: |
          cd registration
          ./docker_build ${GITHUB_SHA}
          kubectl set image deployment/icrsbot icrsbot=localhost:32000/icrsbot:${GITHUB_SHA}
