apiVersion: apps/v1
kind: Deployment
metadata:
  name: printer-notification-deployment
spec:
  replicas: 1  # Number of replicas you want to run
  selector:
    matchLabels:
      app: printer-notification
  template:
    metadata:
      labels:
        app: printer-notification
    spec:
      containers:
      - name: printer-notification
        image: localhost:32000/printer-notification:latest  # Replace with your Python Docker image and tag
        ports:
        - containerPort: 5000  # Port your Python application is listening on
        imagePullPolicy: "Always"
        env:
          - name: TZ
            value: Europe/London
          - name: DISCORD_TOKEN
            valueFrom:
              secretKeyRef:
                name: discord-bot-secret 
                key: discord_token
          - name: DATABASE_ADAPTER_ENDPOINT
            valueFrom:
              configMapKeyRef:
                name: database-config
                key: endpoint-url
          - name: RABBITMQ_HOST
            valueFrom:
              secretKeyRef:
                name: print-queue-default-user
                key: host
          - name: RABBITMQ_USERNAME
            valueFrom:
              secretKeyRef:
                name: print-queue-default-user
                key: username
          - name: RABBITMQ_PASSWORD
            valueFrom:
              secretKeyRef:
                name: print-queue-default-user
                key: password
          - name: RABBITMQ_PORT
            valueFrom:
              secretKeyRef:
                name: print-queue-default-user
                key: port
        volumeMounts:
          - name: discord-bot-secret
            mountPath: /app/settings.json
            subPath: settings.json
            readOnly: true
          - name: rabbitmq-config
            mountPath: /app/rabbitmq.json
            subPath: rabbitmq.json
            readOnly: true


      volumes:
        - name: discord-bot-secret
          secret:
            secretName: discord-bot-secret
            items:
              - key: discord_settings
                path: settings.json
        - name: rabbitmq-config
          secret:
            secretName: rabbitmq-secret
            items:
              - key: printer_rabbitmq.json
                path: rabbitmq.json