apiVersion: apps/v1
kind: Deployment
metadata:
  name: icrsbot-reduced-deployment
spec:
  replicas: 1  # Number of replicas you want to run
  selector:
    matchLabels:
      app: icrsbot-reduced
  template:
    metadata:
      labels:
        app: icrsbot-reduced
    spec:
      containers:
      - name: icrsbot-reduced
        image: localhost:32000/icrsbot-reduced  # Replace with your Python Docker image and tag
        ports:
        - containerPort: 5000  # Port your Python application is listening on
        imagePullPolicy: "Always"
        env:
          - name: DISCORD_TOKEN
            valueFrom:
              secretKeyRef:
                name: discord-bot-secret 
                key: discord_token
